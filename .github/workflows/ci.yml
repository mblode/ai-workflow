name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@12.0.2
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check-types
      - run: npm run build
      - name: Install pinned Playwright browser
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Capture and check slides
        run: node scripts/verify-slides.mjs
      - name: Upload slide review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: slide-review-${{ github.sha }}
          path: out/slide-review/
          retention-days: 14
